<style>
:root{
  --cream:#F6F1E7;
  --paper:#FCF8EE;
  --ink:#14332A;
  --green:#14432E;
  --green-soft:#2A805A;
  --gold:#C9963A;
  --gold-pale:#E4CE9B;
  --muted:#6C7C72;
  --rule:rgba(20,67,46,.13);
  --shadow:0 18px 44px rgba(20,67,46,.13);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.85;
  overflow-x:hidden;
}
body[dir=ltr]{line-height:1.75;}

/* ══ الغلاف ══ */
.wrap{max-width:940px;margin:0 auto;padding:0 20px;}

/* ══ شريطُ اللغة ══ */
.langbar{
  position:sticky;top:0;z-index:20;
  background:rgba(246,241,231,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
.langbar .wrap{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding-top:9px;padding-bottom:9px;
}
.mark{
  font-family:'Amiri',serif;font-size:23px;font-weight:700;
  color:var(--green);line-height:1;letter-spacing:.01em;
}
.langs{display:flex;gap:4px;}
.langs button{
  font:inherit;font-size:12.5px;font-weight:500;
  padding:5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid transparent;background:none;color:var(--muted);
  transition:color .18s,background .18s,border-color .18s;
}
.langs button:hover{color:var(--green);}
.langs button[aria-pressed=true]{
  color:var(--green);border-color:var(--gold-pale);background:rgba(201,150,58,.09);
}
.langs button:focus-visible,a:focus-visible{
  outline:2px solid var(--gold);outline-offset:3px;
}

/* ══ الافتتاح ══ */
.hero{padding:46px 0 8px;text-align:center;}
.hero h1{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(52px,15vw,86px);
  line-height:1;margin:0;color:var(--green);
}
.hero .tag{
  font-size:clamp(15px,4vw,18px);color:var(--muted);
  margin:14px auto 0;max-width:30ch;
}
.hero .arc{display:block;width:clamp(150px,42vw,220px);height:auto;margin:20px auto 0;}
.lead{
  max-width:34ch;margin:22px auto 0;
  font-size:clamp(15.5px,4.1vw,17.5px);color:var(--ink);
}

/* ══ الدعوة ══ */
.cta{
  display:inline-block;margin-top:26px;
  padding:15px 40px;border-radius:999px;
  background:linear-gradient(160deg,var(--green-soft),var(--green));
  color:#FBF4E2;text-decoration:none;
  font-weight:700;font-size:16.5px;letter-spacing:.01em;
  box-shadow:0 12px 28px rgba(20,67,46,.26);
  transition:transform .16s ease,box-shadow .2s ease;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(20,67,46,.3);}
.cta:active{transform:translateY(0);}
.cta-note{display:block;margin-top:11px;font-size:12.5px;color:var(--muted);}

/* ══ الأقسام ══ */
section{padding:56px 0 8px;}
section h2{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(27px,7vw,38px);line-height:1.35;
  margin:0 0 6px;color:var(--green);
}
.rule{width:64px;height:2px;border-radius:2px;margin:0 0 20px;
  background:linear-gradient(90deg,var(--green-soft),var(--gold));}
section p{max-width:62ch;margin:0 0 15px;}
body[dir=ltr] section p{max-width:66ch;}

/* ══ اللقطات ══ */
.shot{
  width:100%;
  aspect-ratio:560 / 1212;
  border-radius:18px;
  background-image:var(--sheet);
  background-repeat:no-repeat;
  background-size:100% 1200%;
  background-position:0 calc(var(--f) * 100% / 11);
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.7);
}
figure{margin:0;}
figcaption{
  margin-top:11px;font-size:13px;line-height:1.7;color:var(--muted);
  text-align:center;max-width:26ch;margin-inline:auto;
}

.pair{display:grid;gap:26px;margin-top:30px;}
@media (min-width:640px){ .pair{grid-template-columns:1fr 1fr;gap:30px;} }

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px;}
.trio figcaption{font-size:11.5px;line-height:1.55;max-width:none;}
.trio .shot{border-radius:11px;box-shadow:0 10px 22px rgba(20,67,46,.12);}
@media (min-width:560px){ .trio{gap:18px;} .trio figcaption{font-size:13px;} }

.hero-shot{max-width:290px;margin:30px auto 0;}

/* ══ الإيجاز ══ */
.brief{display:grid;gap:34px;margin-top:32px;}
@media (min-width:620px){ .brief{grid-template-columns:1fr 1fr;gap:34px 40px;} }
.brief .item{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:start;}
.brief h3{
  font-family:'Amiri',serif;font-weight:700;font-size:20px;
  margin:0 0 3px;color:var(--green);line-height:1.4;
}
.brief p{font-size:14.5px;line-height:1.8;color:var(--muted);margin:0;max-width:34ch;}
.brief .shot{border-radius:12px;box-shadow:0 10px 22px rgba(20,67,46,.12);}

/* ══ الخاتمة ══ */
.close{
  margin:64px 0 0;padding:44px 24px 52px;text-align:center;
  border-top:1px solid var(--rule);
}
.close p{max-width:38ch;margin:0 auto 4px;color:var(--muted);font-size:15px;}
.foot{
  padding:26px 0 40px;text-align:center;
  font-size:12.5px;color:var(--muted);
}
.foot a{color:var(--green);text-decoration:none;border-bottom:1px solid var(--gold-pale);}

@media (prefers-reduced-motion:reduce){
  .cta{transition:none;}
  .cta:hover{transform:none;}
}
</style>
</head>

};

var CODES = ['ar','en','ms','id'];

function set(id, txt){ var e = document.getElementById(id); if(e) e.textContent = txt; }

function apply(code){
  var t = L[code];
  if(!t) return;

  document.documentElement.lang = code;
  document.documentElement.dir  = t.dir;
  document.body.dir = t.dir;

  /* شريطُ اللقطات: لغةٌ واحدةٌ تُحمَّل، لا أربع */
  document.body.style.setProperty('--sheet', 'url("shots-' + code + '.webp")');

  set('mark', t.mark);
  set('h-title', t.title);
  set('h-tag', t.tag);
  set('h-lead', t.lead);
  set('cta-top', t.cta);
  set('cta-bottom', t.cta);
  set('cta-note', t.ctaNote);
  set('cta-note2', t.ctaNote);

  set('d-title', t.dTitle);
  set('d-p1', t.dP1); set('d-p2', t.dP2); set('d-p3', t.dP3);
  set('d-c1', t.dC1); set('d-c2', t.dC2);

  set('q-title', t.qTitle);
  set('q-p1', t.qP1); set('q-p2', t.qP2); set('q-p3', t.qP3);
  set('q-c1', t.qC1); set('q-c2', t.qC2); set('q-c3', t.qC3);

  set('r-title', t.rTitle);
  var b = document.getElementById('brief');
  b.innerHTML = '';
  t.items.forEach(function(it){
    var d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = '<div class="shot" style="--f:' + it[0] + '"></div>'
                + '<div><h3></h3><p></p></div>';
    d.querySelector('h3').textContent = it[1];
    d.querySelector('p').textContent  = it[2];
    b.appendChild(d);
  });

  set('c-p1', t.cP1);
  set('c-p2', t.cP2);

  document.querySelectorAll('#langs button').forEach(function(btn){
    btn.setAttribute('aria-pressed', btn.dataset.code === code ? 'true' : 'false');
  });

  try{ localStorage.setItem('zahim_intro_lang', code); }catch(e){}
}

/* أزرارُ اللغات */
(function(){
  var nav = document.getElementById('langs');
  CODES.forEach(function(c){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.code = c;
    btn.textContent = L[c].name;
    btn.lang = c;
    btn.onclick = function(){ apply(c); };
    nav.appendChild(btn);
  });
})();

/* اللغةُ الأولى: ما اختاره القارئُ من قبل، ثمّ لغةُ جهازه، ثمّ العربيّة */
(function(){
  var pick = null;
  try{ pick = localStorage.getItem('zahim_intro_lang'); }catch(e){}
  if(!pick || CODES.indexOf(pick) < 0){
    var list = navigator.languages || [navigator.language || 'ar'];
    for(var i = 0; i < list.length && !pick; i++){
      var code = String(list[i] || '').toLowerCase().split('-')[0];
      if(code === 'in') code = 'id';
      if(CODES.indexOf(code) >= 0) pick = code;
    }
  }
  apply(pick || 'ar');
})();
</script>
