<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>زاحِم — اسمٌ من المزاحمة</title>
<meta name="description" content="زاحِم: بوصلةٌ تجمع أورادَ يومك، ومواقيتُ وقبلةٌ ومصحفٌ ورياضُ السنّة وتسبيح.">
<meta name="theme-color" content="#F6F1E7">
<link rel="icon" href="icons/icon-192.png">

<meta property="og:title" content="زاحِم">
<meta property="og:description" content="اسمٌ من المزاحمة. فزاحِمْ هاتفك بما ينفعك.">
<meta property="og:image" content="https://zahim.app/icons/icon-512.png">
<meta property="og:url" content="https://zahim.app/intro">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="shots.webp">

<style>
:root{
  --cream:#F6F1E7;
  --ink:#14332A;
  --green:#14432E;
  --green-soft:#2A805A;
  --gold:#C9963A;
  --gold-pale:#E4CE9B;
  --muted:#6C7C72;
  --rule:rgba(20,67,46,.14);
  --lang:0;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--cream);color:var(--ink);
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}

.deck{
  position:fixed;inset:0;display:flex;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.deck::-webkit-scrollbar{display:none;}

.slide{
  flex:0 0 100%;width:100%;height:100%;
  scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;
  padding:
    calc(env(safe-area-inset-top) + 50px)
    14px
    calc(env(safe-area-inset-bottom) + 62px);
}

/* ══ الصفحةُ اللامعة ══
   زجاجٌ لا ورق: ضوءٌ يقع من أعلى فيلمع الوجه، وحاشيةُ حرفٍ بيضاء،
   وظلٌّ يرفعها. وهي مادّةُ حبّة التسبيح وخاتم البوصلة نفسُها. */
.page{
  position:relative;flex:1 1 auto;min-height:0;width:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:20px 16px 18px;text-align:center;
  border-radius:30px;
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;scrollbar-width:none;
  border:1px solid rgba(255,255,255,.92);
  background:
    radial-gradient(130% 78% at 26% -4%,
      rgba(255,255,255,.96), rgba(255,255,255,.42) 44%, rgba(255,255,255,0) 74%),
    linear-gradient(168deg,#FDFAF2 0%,#F7F1E2 58%,#F1E9D6 100%);
  box-shadow:
    0 24px 54px rgba(20,67,46,.15), 0 3px 10px rgba(20,67,46,.07),
    inset 0 1px 0 rgba(255,255,255,.98), inset 0 -14px 30px rgba(158,132,86,.10);
}
.page::-webkit-scrollbar{display:none;}
.page::before{
  content:'';position:absolute;left:-14%;top:-30%;width:78%;height:56%;
  border-radius:50%;pointer-events:none;transform:rotate(-18deg);
  background:radial-gradient(ellipse at 50% 50%,
    rgba(255,255,255,.62), rgba(255,255,255,0) 70%);
}

/* بريقٌ يمرّ على وجه الصفحة — ومضةٌ سريعةٌ ثمّ سكون */
.page::after{
  content:'';position:absolute;top:0;bottom:0;width:34%;
  pointer-events:none;
  background:linear-gradient(100deg,
    rgba(255,255,255,0), rgba(255,255,255,.66) 46%, rgba(255,255,255,0));
  /* مَيْلٌ لا دوران: الدورانُ يُخرج البريقَ عن حدّ الصفحة فيُحسب في
     ارتفاع التمرير، والمَيْلُ يزيح أفقيًّا وحدَه. */
  transform:skewX(-13deg);
  animation:sheen 6.5s ease-in-out infinite;
}
@keyframes sheen{
  0%   { inset-inline-start:-45%; opacity:0; }
  6%   { opacity:.95; }
  22%  { inset-inline-start:118%; opacity:0; }
  100% { inset-inline-start:118%; opacity:0; }
}

/* ══ النصّ — كبيرٌ يملأ العين ══ */
.txt{display:contents;}
.page h2{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(30px,5.9vh,48px);line-height:1.28;
  margin:0 0 8px;color:var(--green);
}
.page .rule{
  width:70px;height:3px;border-radius:3px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--green-soft),var(--gold));
}
.page p{
  margin:0 0 12px;max-width:26ch;
  font-size:clamp(19px,3.05vh,29px);
  line-height:1.62;color:var(--ink);font-weight:500;
}
.page p.dim{color:var(--muted);}
body[dir=ltr] .page p{max-width:30ch;}

/* ══ اللقطة — واحدةٌ في كلّ صفحة، كبيرةٌ واضحة ══ */
.stage{
  flex:1 1 auto;min-height:140px;width:100%;
  display:flex;align-items:center;justify-content:center;
  margin-top:10px;
}
.shot{
  height:100%;max-height:100%;aspect-ratio:520 / 1125;
  border-radius:18px;
  background-image:url("shots.webp");
  background-repeat:no-repeat;
  background-size:400% 1100%;
  background-position:calc(var(--lang) * 100% / 3) calc(var(--f) * 100% / 10);
  box-shadow:0 18px 42px rgba(20,67,46,.20);
  border:1px solid rgba(255,255,255,.75);
}

/* ══ الغلاف ══ */
.page.cover{justify-content:center;}
.page.cover .seal{
  width:clamp(84px,13vh,124px);height:auto;
  margin:0 0 16px;
  filter:drop-shadow(0 10px 22px rgba(20,67,46,.26));
}
.page.cover h1{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(70px,14.5vh,132px);line-height:1;
  margin:0;color:var(--green);
}
.page.cover .tag{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(25px,4.3vh,40px);color:var(--green-soft);
  margin:14px 0 0;max-width:20ch;line-height:1.4;
}
.page.cover .lead{
  max-width:22ch;font-size:clamp(17px,2.6vh,24px);
  color:var(--muted);margin-top:12px;
}
.swipe{
  margin-top:26px;font-size:16px;color:var(--muted);
  display:flex;align-items:center;gap:9px;
}
.swipe svg{width:32px;height:13px;}

/* ══ الخاتمة ══ */
.page.last{justify-content:center;}
.page.last .stage{flex:0 0 auto;height:clamp(120px,24vh,240px);margin-bottom:14px;}
.cta{
  position:relative;overflow:hidden;
  display:inline-block;margin-top:16px;
  padding:18px 52px;border-radius:999px;
  background:linear-gradient(162deg,#3FA37A 0%,var(--green-soft) 42%,#0F3927 100%);
  color:#FBF4E2;text-decoration:none;
  font-weight:700;font-size:clamp(19px,2.7vh,24px);
  box-shadow:0 14px 32px rgba(20,67,46,.30),
    inset 0 1px 0 rgba(255,255,255,.34), inset 0 -6px 16px rgba(0,0,0,.20);
}
.cta::before{
  content:'';position:absolute;left:10%;top:6%;width:54%;height:42%;
  border-radius:50%;pointer-events:none;transform:rotate(-20deg);
  background:radial-gradient(ellipse at 50% 50%,
    rgba(255,255,255,.40), rgba(255,255,255,0) 70%);
}
.cta:active{transform:scale(.975);}
.cta-note{display:block;margin-top:12px;font-size:15px;color:var(--muted);}

/* ══ شريطُ اللغة ══ */
.top{
  position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:8px 16px;
}
.mark{font-family:'Amiri',serif;font-size:21px;font-weight:700;color:var(--green);line-height:1;}
.langs{display:flex;gap:2px;}
.langs button{
  font:inherit;font-size:12px;font-weight:500;
  padding:5px 9px;border-radius:999px;cursor:pointer;
  border:1px solid transparent;background:none;color:var(--muted);
}
.langs button[aria-pressed=true]{
  color:var(--green);border-color:var(--gold-pale);background:rgba(201,150,58,.10);
}

/* ══ المِقوَد ══ */
.nav{
  position:fixed;bottom:env(safe-area-inset-bottom);left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:10px 16px 14px;
}
.dots{display:flex;gap:7px;}
.dots button{
  width:7px;height:7px;padding:0;border-radius:50%;cursor:pointer;
  border:0;background:rgba(20,67,46,.22);
  transition:background .2s,transform .2s;
}
.dots button[aria-current=true]{background:var(--green-soft);transform:scale(1.45);}
.arrow{
  width:36px;height:36px;flex:0 0 auto;
  display:grid;place-items:center;cursor:pointer;
  border-radius:50%;border:1px solid var(--rule);
  background:rgba(255,255,255,.6);color:var(--green);
}
.arrow svg{width:15px;height:15px;}
.arrow[disabled]{opacity:.3;cursor:default;}

button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

/* شاشةٌ قصيرة: تُضيَّق المسافات قبل أن يُمسّ حجمُ الخطّ */
@media (max-height:700px){
  .page{padding:15px 13px 13px;border-radius:24px;}
  .page h2{margin-bottom:6px;}
  .page .rule{margin-bottom:11px;}
  .page p{margin-bottom:8px;}
  .page.last .stage{height:clamp(110px,20vh,180px);margin-bottom:10px;}
  .cta{margin-top:10px;padding:15px 42px;}
}
/* الجوّالُ عرضًا: عمودُ كلامٍ وعمودُ صورة */
@media (max-height:600px) and (min-width:620px){
  .page{flex-direction:row;align-items:center;gap:20px;padding:16px 20px;}
  .txt{display:flex;flex-direction:column;align-items:center;
    justify-content:center;flex:1 1 0;min-width:0;}
  .page .stage{flex:1 1 0;min-width:0;height:100%;margin-top:0;}
  .page h2{font-size:clamp(22px,6vh,30px);}
  .page p{max-width:32ch;font-size:clamp(15px,4.3vh,19px);margin-bottom:7px;}
  .page.cover,.page.last{flex-direction:column;}
  .page.cover .txt,.page.last .txt{display:contents;}
}
@media (max-height:500px) and (max-width:619px){
  .page .stage{display:none;}
}
@media (max-height:500px){ .page.last .stage{display:none;} }

@media (prefers-reduced-motion:reduce){
  .page::after{animation:none;opacity:0;}
  .dots button{transition:none;}
}
</style>
</head>

  <span class="mark" id="mark">زاحِم</span>
  <nav class="langs" id="langs" aria-label="Language"></nav>

         stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</nav>

var CODES = ['ar','en','ms','id'];
var deck  = document.getElementById('deck');
var dots  = document.getElementById('dots');
var prevB = document.getElementById('prev');
var nextB = document.getElementById('next');
var count = 0, at = 0, rtl = true;

function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt != null) e.textContent = txt;
  return e;
}
function svg(vb, inner){
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', vb);
  s.setAttribute('fill', 'none');
  s.setAttribute('aria-hidden', 'true');
  s.innerHTML = inner;
  return s;
}
function shotEl(frame){
  var d = el('div', 'shot');
  d.style.setProperty('--f', frame);
  return d;
}
function stageOf(frame){
  var st = el('div', 'stage');
  st.appendChild(shotEl(frame));
  return st;
}
function page(cls){
  var sec = el('section', 'slide');
  var pg  = el('div', 'page' + (cls ? ' ' + cls : ''));
  sec.appendChild(pg);
  return { sec:sec, pg:pg };
}

function build(code){
  var t = L[code];
  rtl = (t.dir === 'rtl');
  document.documentElement.lang = code;
  document.documentElement.dir  = t.dir;
  document.body.dir = t.dir;
  document.documentElement.style.setProperty('--lang', t.col);
  document.getElementById('mark').textContent = t.mark;
  prevB.setAttribute('aria-label', t.prev);
  nextB.setAttribute('aria-label', t.next);

  deck.innerHTML = '';

  /* ١ · الغلاف: الشعارُ ثمّ الاسم. ولا زرَّ هنا — الدعوةُ في الأخيرة. */
  var _c = page('cover'), c = _c.pg;
  var logo = document.createElement('img');
  logo.className = 'seal'; logo.src = SEAL; logo.alt = '';
  c.appendChild(logo);
  c.appendChild(el('h1', null, t.title));
  c.appendChild(el('p', 'tag', t.tag));
  c.appendChild(el('p', 'lead', t.lead));
  var sw = el('div', 'swipe');
  sw.appendChild(el('span', null, t.swipe));
  var ar = svg('0 0 40 16',
    '<path d="M2 8h34M29 2l7 6-7 6" stroke="#6C7C72" stroke-width="1.6"'
    + ' stroke-linecap="round" stroke-linejoin="round"/>');
  if(rtl) ar.style.transform = 'scaleX(-1)';
  sw.appendChild(ar);
  c.appendChild(sw);
  deck.appendChild(_c.sec);

  /* ٢ · الشرائحُ الستّ — لقطةٌ واحدةٌ في كلّ صفحة */
  t.slides.forEach(function(s){
    var w = page(), pg = w.pg;
    var tx = el('div', 'txt');
    tx.appendChild(el('h2', null, s.h));
    tx.appendChild(el('div', 'rule'));
    s.p.forEach(function(txt, i){ tx.appendChild(el('p', i ? 'dim' : null, txt)); });
    pg.appendChild(tx);
    pg.appendChild(stageOf(s.f));
    deck.appendChild(w.sec);
  });

  /* ٣ · الخاتمة: هنا وحدَها زرُّ الفتح */
  var _l = page('last'), last = _l.pg;
  last.appendChild(el('h2', null, t.endH));
  last.appendChild(el('div', 'rule'));
  last.appendChild(stageOf(t.endF));
  t.endP.forEach(function(txt, i){ last.appendChild(el('p', i ? 'dim' : null, txt)); });
  var a = el('a', 'cta', t.cta);
  a.href = 'https://zahim.app';
  last.appendChild(a);
  last.appendChild(el('span', 'cta-note', t.ctaNote));
  deck.appendChild(_l.sec);

  count = deck.children.length;

  dots.innerHTML = '';
  for(var i = 0; i < count; i++){
    var b = el('button');
    b.type = 'button'; b.dataset.i = i;
    b.setAttribute('aria-label', String(i + 1));
    b.onclick = function(){ go(+this.dataset.i); };
    dots.appendChild(b);
  }

  document.querySelectorAll('#langs button').forEach(function(btn){
    btn.setAttribute('aria-pressed', btn.dataset.code === code ? 'true' : 'false');
  });

  try{ localStorage.setItem('zahim_intro_lang', code); }catch(e){}
  go(0, true);
}

/* في العربيّة يكون scrollLeft سالبًا، فنُوجّهه بإشارةٍ ونقرؤه بقيمته المطلقة */
function go(i, instant){
  at = Math.max(0, Math.min(count - 1, i));
  deck.scrollTo({
    left: at * deck.clientWidth * (rtl ? -1 : 1),
    behavior: instant ? 'auto' : 'smooth'
  });
  mark();
}
function mark(){
  [].forEach.call(dots.children, function(b, i){
    b.setAttribute('aria-current', i === at ? 'true' : 'false');
  });
  prevB.disabled = (at === 0);
  nextB.disabled = (at === count - 1);
}
prevB.onclick = function(){ go(at - 1); };
nextB.onclick = function(){ go(at + 1); };

var tick = null;
deck.addEventListener('scroll', function(){
  clearTimeout(tick);
  tick = setTimeout(function(){
    var w = deck.clientWidth;
    if(!w) return;
    at = Math.round(Math.abs(deck.scrollLeft) / w);
    mark();
  }, 90);
});

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') go(at + (rtl ? -1 : 1));
  else if(e.key === 'ArrowLeft') go(at + (rtl ? 1 : -1));
  else if(e.key === 'Home') go(0);
  else if(e.key === 'End') go(count - 1);
  else return;
  e.preventDefault();
});

var rz = null;
window.addEventListener('resize', function(){
  clearTimeout(rz);
  rz = setTimeout(function(){ go(at, true); }, 140);
});

(function(){
  var nav = document.getElementById('langs');
  CODES.forEach(function(c){
    var btn = el('button', null, L[c].name);
    btn.type = 'button'; btn.dataset.code = c; btn.lang = c;
    btn.onclick = function(){ build(c); };
    nav.appendChild(btn);
  });
})();

(function(){
  var pick = null;
  try{ pick = localStorage.getItem('zahim_intro_lang'); }catch(e){}
  if(!pick || CODES.indexOf(pick) < 0){
    var list = navigator.languages || [navigator.language || 'ar'];
    for(var i = 0; i < list.length && !pick; i++){
      var code = String(list[i] || '').toLowerCase().split('-')[0];
      if(code === 'in') code = 'id';
      if(CODES.indexOf(code) >= 0) pick = code;
    }
  }
  build(pick || 'ar');
})();
</script>
