<style>
:root{
  --cream:#F6F1E7;
  --ink:#14332A;
  --green:#14432E;
  --green-soft:#2A805A;
  --gold:#C9963A;
  --gold-pale:#E4CE9B;
  --muted:#6C7C72;
  --rule:rgba(20,67,46,.14);
  --lang:0;              /* عمودُ اللغة في الشريط */
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--cream);color:var(--ink);
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}

/* ══ المسرح ══ */
.deck{
  position:fixed;inset:0;
  display:flex;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.deck::-webkit-scrollbar{display:none;}

.slide{
  flex:0 0 100%;width:100%;height:100%;
  scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;flex-direction:column;align-items:center;
  padding:
    calc(env(safe-area-inset-top) + 52px)
    22px
    calc(env(safe-area-inset-bottom) + 72px);
  text-align:center;
}

/* ══ النصّ ══ */
.slide h2{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(21px,4.4vh,31px);line-height:1.35;
  margin:0 0 6px;color:var(--green);
}
.slide .rule{
  width:52px;height:2px;border-radius:2px;margin:0 0 12px;
  background:linear-gradient(90deg,var(--green-soft),var(--gold));
}
.slide p{
  margin:0 0 9px;max-width:38ch;
  font-size:clamp(12.5px,1.9vh,16px);
  line-height:1.75;color:var(--ink);
}
.slide p.dim{color:var(--muted);}
body[dir=ltr] .slide p{max-width:44ch;}

/* ══ اللقطات ══
   شريطٌ واحدٌ فيه أربعُ لغاتٍ في الأعمدة وإحدى عشرةَ لقطةً في الصفوف.
   فالموضعُ الأفقيُّ يختار اللغة، والرأسيُّ يختار اللقطة. */
.shot{
  height:100%;max-height:100%;aspect-ratio:520 / 1125;
  border-radius:16px;
  background-image:url("shots.webp");
  background-repeat:no-repeat;
  background-size:400% 1100%;
  background-position:
    calc(var(--lang) * 100% / 3)
    calc(var(--f) * 100% / 10);
  box-shadow:0 16px 38px rgba(20,67,46,.16);
  border:1px solid rgba(255,255,255,.7);
}
.stage{
  flex:1 1 auto;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin-top:12px;
}
figure{display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;margin:0;min-width:0;}
.cap{
  margin-top:8px;font-size:clamp(10px,1.45vh,12.5px);
  line-height:1.5;color:var(--muted);
}

/* ارتفاعُ اللقطة محكومٌ بالطول وبالعرض معًا، فلا تخرج عن حافّة الشاشة
   حين تكون طويلةً ضيّقة. النسبة 1125 ÷ 520 = 2.1635 */
.two .shot{height:min(100%, calc((100vw - 56px) * 1.0817));}
.three .shot{height:min(100%, calc((100vw - 68px) * 0.7212));}

/* ══ الغلاف ══ */
.cover{justify-content:center;}
.cover h1{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(56px,12vh,100px);line-height:1;
  margin:0;color:var(--green);
}
.cover .tag{
  font-family:'Amiri',serif;
  font-size:clamp(16px,2.7vh,22px);color:var(--green-soft);
  margin:14px 0 0;max-width:30ch;
}
.cover .arc{width:clamp(140px,34vw,210px);height:auto;margin:20px 0 16px;}
.cover .lead{max-width:26ch;font-size:clamp(14px,2.1vh,17px);}
.swipe{
  margin-top:24px;font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.swipe svg{width:30px;height:12px;}

/* ══ الخاتمة ══ */
.last{justify-content:center;}
.last .stage{flex:0 0 auto;height:clamp(110px,27vh,280px);margin-bottom:14px;}
.cta{
  display:inline-block;margin-top:14px;
  padding:15px 42px;border-radius:999px;
  background:linear-gradient(160deg,var(--green-soft),var(--green));
  color:#FBF4E2;text-decoration:none;
  font-weight:700;font-size:17px;
  box-shadow:0 12px 28px rgba(20,67,46,.26);
}
.cta:active{transform:scale(.975);}
.cta-note{display:block;margin-top:10px;font-size:12px;color:var(--muted);}

/* ══ شريطُ اللغة ══ */
.top{
  position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:8px 16px;
}
.mark{font-family:'Amiri',serif;font-size:20px;font-weight:700;color:var(--green);line-height:1;}
.langs{display:flex;gap:2px;}
.langs button{
  font:inherit;font-size:11.5px;font-weight:500;
  padding:5px 9px;border-radius:999px;cursor:pointer;
  border:1px solid transparent;background:none;color:var(--muted);
}
.langs button[aria-pressed=true]{
  color:var(--green);border-color:var(--gold-pale);background:rgba(201,150,58,.10);
}

/* ══ المِقوَد ══ */
.nav{
  position:fixed;bottom:env(safe-area-inset-bottom);left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:12px 16px 16px;
}
.dots{display:flex;gap:7px;}
.dots button{
  width:7px;height:7px;padding:0;border-radius:50%;cursor:pointer;
  border:0;background:rgba(20,67,46,.22);
  transition:background .2s,transform .2s;
}
.dots button[aria-current=true]{background:var(--green-soft);transform:scale(1.45);}
.arrow{
  width:36px;height:36px;flex:0 0 auto;
  display:grid;place-items:center;cursor:pointer;
  border-radius:50%;border:1px solid var(--rule);
  background:rgba(255,255,255,.6);color:var(--green);
}
.arrow svg{width:15px;height:15px;}
.arrow[disabled]{opacity:.3;cursor:default;}

button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

@media (max-height:520px){
  .last .stage{height:clamp(96px,22vh,180px);margin-bottom:10px;}
  .last p{margin-bottom:6px;}
  .cta{margin-top:8px;padding:12px 34px;font-size:15px;}
}
@media (prefers-reduced-motion:reduce){ .dots button{transition:none;} }
</style>

var CODES = ['ar','en','ms','id'];
var deck  = document.getElementById('deck');
var dots  = document.getElementById('dots');
var prevB = document.getElementById('prev');
var nextB = document.getElementById('next');
var count = 0, at = 0, rtl = true;

function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt != null) e.textContent = txt;
  return e;
}
function svg(vb, inner, cls){
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', vb);
  s.setAttribute('fill', 'none');
  s.setAttribute('aria-hidden', 'true');
  if(cls) s.setAttribute('class', cls);
  s.innerHTML = inner;
  return s;
}
function shotEl(frame){
  var d = el('div', 'shot');
  d.style.setProperty('--f', frame);
  return d;
}
function stageOf(frames, caps){
  var stage = el('div', 'stage ' + (frames.length > 2 ? 'three' : 'two'));
  frames.forEach(function(fr, i){
    var fig = el('figure');
    fig.appendChild(shotEl(fr));
    if(caps && caps[i]) fig.appendChild(el('div', 'cap', caps[i]));
    stage.appendChild(fig);
  });
  return stage;
}

/* ══ بناءُ الشرائح ══ */
function build(code){
  var t = L[code];
  rtl = (t.dir === 'rtl');
  document.documentElement.lang = code;
  document.documentElement.dir  = t.dir;
  document.body.dir = t.dir;
  /* عمودُ اللغة في الشريط — الصورةُ واحدةٌ لا تُعاد عند التبديل */
  document.documentElement.style.setProperty('--lang', t.col);
  document.getElementById('mark').textContent = t.mark;
  prevB.setAttribute('aria-label', t.prev);
  nextB.setAttribute('aria-label', t.next);

  deck.innerHTML = '';

  /* الغلاف: لا زرَّ فيه — الدعوةُ في آخر شريحة */
  var c = el('section', 'slide cover');
  c.appendChild(el('h1', null, t.title));
  c.appendChild(el('p', 'tag', t.tag));
  c.appendChild(svg('0 0 200 44',
      '<path d="M6 38 A 220 220 0 0 1 194 38" stroke="#E4CE9B" stroke-width="1.2"/>'
    + '<path d="M40 26.5 A 94 94 0 0 1 160 26.5" stroke="#2A805A" stroke-width="2.6"'
    + ' stroke-linecap="round" opacity=".85"/><circle cx="160" cy="26.5" r="3.4" fill="#2A805A"/>',
    'arc'));
  c.appendChild(el('p', 'lead', t.lead));
  var sw = el('div', 'swipe');
  sw.appendChild(el('span', null, t.swipe));
  var ar = svg('0 0 40 16',
    '<path d="M2 8h34M29 2l7 6-7 6" stroke="#6C7C72" stroke-width="1.6"'
    + ' stroke-linecap="round" stroke-linejoin="round"/>');
  if(rtl) ar.style.transform = 'scaleX(-1)';
  sw.appendChild(ar);
  c.appendChild(sw);
  deck.appendChild(c);

  /* الشرائحُ الأربع */
  t.slides.forEach(function(s){
    var sec = el('section', 'slide');
    sec.appendChild(el('h2', null, s.h));
    sec.appendChild(el('div', 'rule'));
    s.p.forEach(function(txt, i){ sec.appendChild(el('p', i ? 'dim' : null, txt)); });
    sec.appendChild(stageOf(s.f, s.caps));
    deck.appendChild(sec);
  });

  /* الخاتمة: هنا وحدَها زرُّ الفتح */
  var last = el('section', 'slide last');
  last.appendChild(el('h2', null, t.endH));
  last.appendChild(el('div', 'rule'));
  var st = el('div', 'stage');
  st.appendChild(shotEl(F.lang));
  last.appendChild(st);
  t.endP.forEach(function(txt, i){ last.appendChild(el('p', i ? 'dim' : null, txt)); });
  var a = el('a', 'cta', t.cta);
  a.href = 'https://zahim.app';
  last.appendChild(a);
  last.appendChild(el('span', 'cta-note', t.ctaNote));
  deck.appendChild(last);

  count = deck.children.length;

  dots.innerHTML = '';
  for(var i = 0; i < count; i++){
    var b = el('button');
    b.type = 'button';
    b.dataset.i = i;
    b.setAttribute('aria-label', String(i + 1));
    b.onclick = function(){ go(+this.dataset.i); };
    dots.appendChild(b);
  }

  document.querySelectorAll('#langs button').forEach(function(btn){
    btn.setAttribute('aria-pressed', btn.dataset.code === code ? 'true' : 'false');
  });

  try{ localStorage.setItem('zahim_intro_lang', code); }catch(e){}
  go(0, true);
}

/* ══ التنقّل ══
   في العربيّة يكون scrollLeft سالبًا، فنُوجّهه بإشارةٍ ونقرؤه بقيمته المطلقة. */
function go(i, instant){
  at = Math.max(0, Math.min(count - 1, i));
  deck.scrollTo({
    left: at * deck.clientWidth * (rtl ? -1 : 1),
    behavior: instant ? 'auto' : 'smooth'
  });
  mark();
}
function mark(){
  [].forEach.call(dots.children, function(b, i){
    b.setAttribute('aria-current', i === at ? 'true' : 'false');
  });
  prevB.disabled = (at === 0);
  nextB.disabled = (at === count - 1);
}
prevB.onclick = function(){ go(at - 1); };
nextB.onclick = function(){ go(at + 1); };

var tick = null;
deck.addEventListener('scroll', function(){
  clearTimeout(tick);
  tick = setTimeout(function(){
    var w = deck.clientWidth;
    if(!w) return;
    at = Math.round(Math.abs(deck.scrollLeft) / w);
    mark();
  }, 90);
});

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') go(at + (rtl ? -1 : 1));
  else if(e.key === 'ArrowLeft') go(at + (rtl ? 1 : -1));
  else if(e.key === 'Home') go(0);
  else if(e.key === 'End') go(count - 1);
  else return;
  e.preventDefault();
});

var rz = null;
window.addEventListener('resize', function(){
  clearTimeout(rz);
  rz = setTimeout(function(){ go(at, true); }, 140);
});

/* ══ أزرارُ اللغات ══ */
(function(){
  var nav = document.getElementById('langs');
  CODES.forEach(function(c){
    var btn = el('button', null, L[c].name);
    btn.type = 'button';
    btn.dataset.code = c;
    btn.lang = c;
    btn.onclick = function(){ build(c); };
    nav.appendChild(btn);
  });
})();

/* ══ اللغةُ الأولى ══ */
(function(){
  var pick = null;
  try{ pick = localStorage.getItem('zahim_intro_lang'); }catch(e){}
  if(!pick || CODES.indexOf(pick) < 0){
    var list = navigator.languages || [navigator.language || 'ar'];
    for(var i = 0; i < list.length && !pick; i++){
      var code = String(list[i] || '').toLowerCase().split('-')[0];
      if(code === 'in') code = 'id';
      if(CODES.indexOf(code) >= 0) pick = code;
    }
  }
  build(pick || 'ar');
})();
</script>
